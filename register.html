{% extends "base.html" %}
{% block title %}Create account · MediPulse{% endblock %}
{% block content %}
<div class="eyebrow">Get started</div>
<h2>Create your space.</h2>
<p class="sub">Set up an account in under a minute.</p>
<form method="post" class="stack" novalidate>
  <div class="field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" value="{{ form.name }}" placeholder="Jordan Williams" required></div>
  <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" value="{{ form.email }}" placeholder="you@example.com" required></div>
  <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" required></div>
  <div class="field"><label for="role">I am a</label>
    <select id="role" name="role">
      <option value="patient" {{ 'selected' if form.role == 'patient' }}>Patient</option>
      <option value="doctor" {{ 'selected' if form.role == 'doctor' }}>Care provider</option>
    </select>
  </div>
  <button class="btn block" type="submit">Create account {{ icon('arrow', 14) }}</button>
</form>
<a class="switch" href="{{ url_for('auth.login') }}">Already have an account? Sign in</a>
{% endblock %}
